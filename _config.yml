# GitHub Pages Configuration for FraudShield

# Build settings
markdown: kramdown
highlighter: rouge

# Site settings
title: "FraudShield - AI-Powered Fraud Detection"
description: "Enterprise-grade fraud detection system using advanced machine learning and big data processing"
baseurl: "/FrausShield"
url: "https://nareshdharmaraj.github.io"

# GitHub Pages settings
source: docs
destination: _site

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include files
include:
  - _pages

# Theme
theme: minima

# Social links
github_username: nareshdharmaraj
repository: nareshdharmaraj/FrausShield